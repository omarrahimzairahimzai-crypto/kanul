name: Windows RDP

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest

    steps:

      - name: Check Runner
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Windows Runner Information"
          Write-Host "================================"

          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Computer: $env:COMPUTERNAME"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "Runner is ready."

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Tailscale Status"
          Write-Host "================================"

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $ip = tailscale ip -4 | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IPv4 was not assigned."
              exit 1
          }

          Write-Host $ip

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "================================"
          Write-Host "Creating RDP User"
          Write-Host "================================"

          $username = "RDPUser"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD secret is missing."
              exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Write-Host "Existing RDP user password updated."
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword

              Write-Host "RDP user created."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Username: $username"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Enabling Remote Desktop"
          Write-Host "================================"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "Remote Desktop configuration completed."

      - name: Check RDP Service
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "RDP Service"
          Write-Host "================================"

          $service = Get-Service -Name TermService

          $service | Format-Table -AutoSize

          if ($service.Status -ne "Running") {
              Write-Error "TermService is not running."
              exit 1
          }

      - name: Check RDP Port
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "RDP Port 3389"
          Write-Host "================================"

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
              Write-Host "RDP port 3389 is LISTENING."
              $listener | Format-Table -AutoSize
          }
          else {
              Write-Error "RDP port 3389 is NOT listening."
              exit 1
          }

      - name: Display Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          TEMPORARY RDP READY"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "RDP Address:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "RDPUser"

          Write-Host ""
          Write-Host "Password:"
          Write-Host "Use your RDP_PASSWORD GitHub Secret"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "=============================================="

      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             RDP IS NOW ACTIVE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Address: $env:TAILSCALE_IP`:3389"
          Write-Host "Username: RDPUser"
          Write-Host ""

          while ($true) {

              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP 3389 is active."
              }
              else {
                  Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] WARNING: RDP 3389 is not listening."
              }

              Start-Sleep -Seconds 60
          }
